function applyI18n(){
  const lang=S.lang||localStorage.getItem('ft_lang')||'uz';
  document.documentElement.lang=lang;
  if(!TR||typeof TR!=='object')return;
  if(lang==='uz'){
    document.querySelectorAll('select#lg, select#lgp').forEach(sel=>{if(sel&&sel.value!==lang)sel.value=lang;});
    return;
  }
  const keys=Object.keys(TR).sort((a,b)=>b.length-a.length);
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  let n;
  while(n=w.nextNode()){
    let v=n.nodeValue;
    if(!v||!v.trim())continue;
    let changed=false;
    for(const k of keys){
      const trans=(TR[k]&&TR[k][lang])||'';
      if(trans&&v.includes(k)){
        v=v.split(k).join(trans);
        changed=true;
      }
    }
    if(changed)n.nodeValue=v;
  }
  document.querySelectorAll('[placeholder]').forEach(el=>{
    let p=el.getAttribute('placeholder');
    if(!p)return;
    for(const k of keys){
      const trans=(TR[k]&&TR[k][lang])||'';
      if(trans&&p.includes(k))p=p.split(k).join(trans);
    }
    el.setAttribute('placeholder',p);
  });
  document.querySelectorAll('[aria-label]').forEach(el=>{
    let a=el.getAttribute('aria-label');
    if(!a)return;
    for(const k of keys){
      const trans=(TR[k]&&TR[k][lang])||'';
      if(trans&&a.includes(k))a=a.split(k).join(trans);
    }
    el.setAttribute('aria-label',a);
  });
  document.querySelectorAll('select#lg, select#lgp').forEach(sel=>{
    if(sel&&sel.value!==lang)sel.value=lang;
  });
}

function stampScanToModules(r){
  const today=new Date(Date.now()+5*36e5).toISOString().slice(0,10);
  const nextVacc=new Date(Date.now()+180*864e5).toISOString().slice(0,10);
  const sp=r.species||'Sigir';
  const existing=r.targetAid&&S.animals.find(a=>a.id===r.targetAid);
  const aid=existing?existing.id:(r.aid||('UZ-'+String((S.animals||[]).length+1).padStart(3,'0')));
  r.aid=aid;
  const aname=existing?existing.name:(sp+'-'+aid.split('-').pop());
  const wkg=+r.weight_kg||parseInt(String(r.weight||'300').replace(/\D+/g,''))||300;
  const wstr=r.weight||(wkg+' kg');
  const em=EM[sp]||'🐄';
  // 1) Chorvalar & Pasport
  if(existing){
    Object.assign(existing,{type:sp,breed:r.breed||existing.breed,sex:r.sex||existing.sex,age:r.age||existing.age,w:wstr,bcs:r.bcs||'3.5 / 5',h:r.health_status||'Sog‘lom',e:em,img:r.img||existing.img||''});
  }else{
    if(S.animals.length>=((S.limits&&S.limits.animals)||10)){toast('Hayvonlar limiti tugadi. Tarifni yangilang.');return;}S.animals.unshift({id:aid,name:aname,type:sp,breed:r.breed||'Mahalliy',sex:r.sex||'Urg‘ochi',age:r.age||'2 yosh',w:wstr,bcs:r.bcs||'3.5 / 5',h:r.health_status||'Sog‘lom',e:em,img:r.img||''});
  }
  S.cur=aid;
  // 2) Vazn kuzatuvi
  S.weight.unshift({a:aid,d:today,kg:wkg,wstr,m:'AI Skan',img:r.img||''});
  // 3) Sog‘liq yozuvlari
  S.health.unshift({a:aid,d:today,o:r.health_note||((r.obs&&r.obs[0])||'Tana holati me’yorda'),s:'BCS: '+(r.bcs||'3.5/5')+' ('+(r.health_status||'Sog‘lom')+')',v:'Yo‘q',t:(r.next&&r.next[0])||'Kuzatuvda',img:r.img||''});
  // 4) Emlash va eslatma

  S.vacc.unshift({a:aid,n:vname,d:today,x:nextVacc,img:r.img||''});
  S.rem.unshift(['Emlash — '+vname+' ('+aname+')',nextVacc,'09:00']);
  // 5) Ozuqa rejasi
  const m=GM['Vazn oshirish']||1.2;
  S.fp={aid,aname,w:wkg,goal:'Vazn oshirish',img:r.img||'',b:0,aiFeed:r.feed||[],rows:FD.map(x=>[x[0],x[1],+(wkg*.025*m*x[2]).toFixed(1)])};
  // 6) AI Chat avtomatik suhbat va maqsad so‘rovi
  if(!S.chatLog)S.chatLog=[];
  const autoGreeting=`📊 Sizning hayvoningiz (${aname} · ${aid}) AI Skan natijalari:\n• Tur va zot: ${sp} (${r.breed||'—'})\n• Yosh: ${r.age||'—'} | Taxminiy vazn: ${wstr}\n• Tana holati (BCS): ${r.bcs||'—'} | Sog‘liq: ${r.health_status||'Sog‘lom'}\n• Kunlik ozuqa normasi: ${r.daily_feed_kg||'—'}\n(Barcha ma’lumotlar rasmi bilan Pasport, Vazn, Ozuqa, Sog‘liq va Emlash bo‘limlariga muhrlandi!)\n\n🎯 Endi shaxsiy boqish strategiyasini tuzamiz:\n1) Ushbu jonivorni semirtirmoqchimisiz (bo‘rdoqi), sut yo‘nalishidami yoki naslchilik uchunmi?\n2) Hozir uyingizda bergani qanday yem-xashaklar bor (masalan: beda, pichan, somon, kepak, arpa, makkajo‘xori, kunjara)?\n\nYozib yuboring — men sizga qo‘shimcha yemlar va necha mahal, soat nechada berish jadvalini tuzib, har bir yem vaqtiga 10 minut qolganda xabar boradigan qilib sozlab beraman!`;
  S.chatLog.push({role:'a',text:autoGreeting,imgs:r.img?[r.img]:[]});
}
function applyFeedSchedule(sched,showToast=true){
  if(!Array.isArray(sched)||!sched.length)return;
  let added=0;
  sched.forEach(s=>{
    if(!s||!s.title||!s.time)return;
    const exists=S.rem.some(r=>r[0]===s.title&&r[2]===s.time);
    if(!exists){S.rem.unshift([s.title,'Har kuni',s.time]);added++}
  });
  if(added>0){persist();if(showToast)toast(added+' ta yem vaqti Eslatmalarga qo‘shildi! Har biriga 10 minut qolganda xabar boradi.')}
  else if(showToast)toast('Ushbu yem vaqtlari allaqachon eslatmalarda mavjud.');
}

async function googleLogin(){
  const er=$('#er')||$('#rec_er')||$('#otp_er');
  if(er){er.style.color='var(--bad)';er.textContent='';}
  if(!SB){if(er)er.textContent='Server sozlanmagan.';return;}
  try{
    const r=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/'}});
    if(r.error&&er){er.textContent='Google orqali kirib bo‘lmadi: '+authErr(r.error.message);}
  }catch(e){
    if(er)er.textContent='Google orqali kirishda xatolik: '+((e&&e.message)||e);
  }
}
async function doAuth(em,pw,meta){
  const er=$('#er');if(er){er.textContent='';er.style.color='var(--bad)';}
  if(!SB){if(er)er.textContent='Server sozlanmagan.';return;}
  if(!meta){const r=await SB.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin+'/'}});if(r.error){if(er)er.textContent=authErr(r.error.message);return;}S.authOtp={email:em,mode:'login'};render();return;}
  const r=meta?await SB.auth.signUp({email:em,password:pw,options:{data:meta,emailRedirectTo:location.origin}}):await SB.auth.signInWithPassword({email:em,password:pw});
  if(r.error){if(er){er.style.color='var(--bad)';er.textContent=authErr(r.error.message);}return;}
  if(r.data&&r.data.session){
    S.ob={s:0,a:{}};
    await onSession(r.data.session);
    if(meta&&!new URLSearchParams(location.search).has('listing')&&!new URLSearchParams(location.search).has('seller'))location.hash='#/onboarding';
    return;
  }
  if(meta){
    S.authOtp={email:em,meta:meta,mode:'signup'};
    render();
    return;
  }
  if(er){er.style.color='var(--ok)';er.textContent='Emailingizga tasdiqlash xati yuborildi. Havolani bosing.';}
}

const fired10Min=new Set();
setInterval(()=>{
  const now=new Date();
  const today=now.toISOString().slice(0,10);
  const curMin=now.getHours()*60+now.getMinutes();
  (S.rem||[]).forEach(r=>{
    const title=r[0],dStr=r[1],tStr=r[2];
    if(!tStr)return;
    if(dStr&&dStr!=='Har kuni'&&dStr!=='Bugun'&&dStr!==today)return;
    const m=/^(\d{1,2}):(\d{2})$/.exec(String(tStr).trim());
    if(!m)return;
    const targetMin=(+m[1])*60+(+m[2]);
    const diff=targetMin-curMin;
    if(diff>=9&&diff<=10){
      const key=today+'|'+tStr+'|'+title;
      if(!fired10Min.has(key)){
        fired10Min.add(key);
        fireNotification('⏰ 10 minut qoldi!',title+' vaqtiga 10 minut qoldi (soat '+tStr+').');
      }
    }
  });
},20000);

 else if(d.fav){e.preventDefault();const on=b.textContent.trim()=='❤️';const r=on?await SB.from('listing_favorites').delete().eq('listing_id',d.fav):await SB.from('listing_favorites').upsert({user_id:await meId(),listing_id:d.fav});if(r.error)toast('Saqlab bo‘lmadi');else b.textContent=on?'🤍':'❤️'}
 else if(d.ms){const [id,st]=d.ms.split('|');if(!confirm(st=='sold'?'E’lonni “sotildi” deb belgilaysizmi?':'E’lonni o‘chirasizmi?'))return;const r=await SB.from('listings').update({status:st}).eq('id',id);toast(r.error?'Xatolik yuz berdi':'Saqlandi');render()}
 else{if(d.appr&&d.payment==='1'&&!confirm('10 000 so‘m to‘lovni qabul qilib tekshirdingizmi?'))return;const body=d.appr?{action:'approve',id:d.appr}:d.rej?{action:'reject',id:d.rej}:{action:'set_plan',user_id:$('#gu').value.trim(),plan:$('#gp').value,months:+$('#gm').value||1};try{await api('/api/admin-action',body);toast('Bajarildi');render()}catch(er){toast(er.message)}}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='mr'){S.mr=t.value;S.mlim=20;render()}else if(t.id=='ms'){S.ms=t.value;render()}
 else if(t.id=='ml_f'){const pv=$('#prev');pv.innerHTML='';[...t.files].slice(0,3).forEach(f=>{const i=document.createElement('img');i.alt='Tanlangan rasm';i.style.cssText='width:84px;height:64px;object-fit:cover;border-radius:8px';i.src=URL.createObjectURL(f);pv.appendChild(i)})}});
document.addEventListener('submit',async e=>{const f=e.target;
 if(f.id=='mqf'){e.preventDefault();S.mq=$('#mq').value;S.mlim=20;render()}
 else if(f.id=='tf'){e.preventDefault();const t=$('#tq').value.trim();if(!t)return;const [lid,peer]=S.th.split('|'),me=await meId();const r=await SB.from('listing_messages').insert({listing_id:lid,from_id:me,to_id:peer,body:t});if(r.error){toast('Xabar yuborilmadi');return}$('#tq').value='';const b=$('#cb');b.innerHTML=await loadMsgs(lid,peer,me);b.scrollTop=b.scrollHeight}
 else if(f.id=='mf2'){e.preventDefault();const v=id=>$('#'+id).value.trim(),er=$('#er2');er.style.color='var(--bad)';er.textContent='';const price=+v('ml_p'),tel=v('ml_ph').replace(/[\s()-]/g,''),files=[...$('#ml_f').files].slice(0,3);
  if(!v('ml_t')||!(price>0)||!/^\+?\d{9,13}$/.test(tel)){er.textContent='Sarlavha, narx va to‘g‘ri telefon raqamini kiriting.';return}
  if(!files.length||files.some(x=>!/^image\/(jpeg|png)$/.test(x.type))){er.textContent='Rasm yuklanmadi. JPG yoki PNG formatidan foydalaning.';return}
  const btn=f.querySelector('button');btn.disabled=true;er.style.color='var(--ok)';er.textContent='Rasm tekshirilmoqda, bir oz kuting…';
  try{const images=await Promise.all(files.map(async x=>b64(await comp(x))));
   const r=await api('/api/listings',{title:v('ml_t'),species:v('ml_s'),breed:v('ml_b'),age:v('ml_a'),weight:v('ml_w'),price,region:v('ml_r'),phone:tel,description:v('ml_d'),images});
   if(r.status=='active'){toast('E’lon joylandi');location.hash='#/market-my'}
   else if(r.status=='pending_review'){f.outerHTML=`<div class="card"><h3>E’lon saqlandi: administrator tekshiruvida</h3><p>${esc(r.warning||'AI rasm tekshiruvi hozir band bo‘lgani uchun e’loningiz saqlandi va administrator tekshiruvidan so‘ng faollashtiriladi.')}</p><p class="muted">E’lon raqami: ${esc((r.id||'').slice(0,8))}</p><a class="btn" href="#/market-my">E’lonlarim</a></div>`}
   else f.outerHTML=`<div class="card"><h3>E’lon qabul qilindi: to‘lov kutilmoqda</h3><p><a class="btn" href="https://t.me/Life_Uz1" target="_blank" rel="noopener">Telegram orqali to‘lovni kelishish</a></p><p>E’lon narxi 10 000 so‘m. To‘lovdan keyin e’lon bozorda ko‘rinadi.</p><p><b>${esc(r.pay||'')}</b></p><p class="muted">E’lon raqami: ${esc((r.id||'').slice(0,8))}</p><a class="btn" href="#/market-my">E’lonlarim</a></div>`}
  catch(x){er.style.color='var(--bad)';er.textContent=x.message||'Xatolik yuz berdi. Qayta urinib ko‘ring.';btn.disabled=false}}});
document.addEventListener('click',async e=>{if(e.target.id!='aidiag')return;const o=$('#aidiagout');o.textContent='Tekshirilmoqda…';try{const r=await fetch('/api/ai-test',{headers:{Authorization:'Bearer '+await tok()}});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);
 o.textContent='Ustuvorlik: '+j.priority+'\n'+j.providers.map(p=>p.provider+': '+(p.ok?'ISHLAYAPTI ('+p.model+', '+p.ms+' ms)':'XATO '+(p.status||'')+' '+p.error)+(p.availableModels?' [Mavjud: '+p.availableModels.slice(0,5).join(', ')+']':'')).join('\n')}catch(x){o.textContent='Tekshirib bo‘lmadi: '+x.message}});
document.addEventListener('submit',async e=>{if(e.target.id!=='profile-edit')return;e.preventDefault();const name=$('#profile-name').value.trim();if(!name)return;const b=e.target.querySelector('button');b.disabled=true;try{await api('/api/account',{full_name:name});S.user=name;await persistNow();toast('Profil saqlandi');render()}catch(x){toast(x.message)}finally{b.disabled=false}});
new MutationObserver(()=>{const el=document.getElementById('profile-id');if(el&&el.textContent!==S.uid)el.textContent=S.uid||'—'}).observe(document.getElementById('app')||document.body,{childList:true,subtree:true});
const listingCache=new Map();
function cacheListing(l){listingCache.set(l.id,l)}
function listingUrl(id){const u=new URL(location.origin+location.pathname);u.searchParams.set('listing',id);u.hash='/market-view';return u.href}
function sellerUrl(nick){const u=new URL(location.origin+location.pathname);u.searchParams.set('seller',nick);u.hash='/seller';return u.href}
function listingPhotos(l){return (l.photos?.length?l.photos:[l.photo_path]).filter(Boolean).map(pubUrl)}
let galleryState=null;
function marketDialog(id){document.getElementById(id)?.remove();const d=document.createElement('dialog');d.id=id;d.className='market-dialog';document.body.append(d);d.addEventListener('close',()=>d.remove());d.addEventListener('click',e=>{if(e.target===d)d.close()});return d}
function openPhoto(id,index=0){const l=listingCache.get(id);if(!l)return;const photos=listingPhotos(l);if(!photos.length)return toast('Rasm topilmadi');galleryState={id,index:Math.max(0,index),photos};const d=marketDialog('photo-viewer');d.innerHTML=`<div class="dialog-actions"><b>${esc(l.title)}</b><button type="button" class="dialog-close" aria-label="Rasmni yopish" data-dialog-close>×</button></div><div class="gallery-stage"><img id="large-listing-photo" alt="Hayvonning kattalashtirilgan rasmi"><span class="gallery-watermark">Fermer Tog‘a AI</span></div><div class="dialog-actions"><button type="button" class="btn alt" data-gallery-step="-1" aria-label="Oldingi rasm">←</button><span id="photo-counter"></span><button type="button" class="btn alt" data-gallery-step="1" aria-label="Keyingi rasm">→</button><button type="button" class="btn" data-share-listing="${l.id}">↗ Ulashish</button></div>`;paintPhoto();d.showModal();d.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();stepPhoto(1)}if(e.key==='ArrowLeft'){e.preventDefault();stepPhoto(-1)}})}
function paintPhoto(){const g=galleryState;if(!g)return;g.index=(g.index+g.photos.length)%g.photos.length;document.getElementById('large-listing-photo').src=g.photos[g.index];document.getElementById('photo-counter').textContent=(g.index+1)+' / '+g.photos.length}
function stepPhoto(n){if(galleryState){galleryState.index+=n;paintPhoto()}}
async function sharedImageFile(l){const url=listingPhotos(l)[0];if(!url)return null;const r=await fetch(url);if(!r.ok)throw Error('Rasm yuklanmadi');const bmp=await createImageBitmap(await r.blob());const scale=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);const imgH=Math.round(bmp.height*scale);c.height=imgH+160;const x=c.getContext('2d');x.fillStyle='#0b2518';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,imgH);bmp.close();x.fillStyle='#fff';x.font='bold '+Math.max(16,Math.round(c.width/34))+'px Arial';x.fillText('Fermer Tog‘a AI · '+money(l.price),20,imgH+42,c.width-40);x.font=Math.max(14,Math.round(c.width/50))+'px Arial';x.fillText(l.title,20,imgH+80,c.width-40);x.fillText(listingUrl(l.id),20,imgH+120,c.width-40);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.9));return blob?new File([blob],'fermer-toga-'+l.id+'.jpg',{type:'image/jpeg'}):null}
async function copyText(text){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return}const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();if(!document.execCommand('copy')){t.remove();throw Error('Nusxalab bo‘lmadi')}t.remove()}
async function shareListing(id){const l=listingCache.get(id);if(!l)return;const url=listingUrl(id),text=l.title+' · '+money(l.price)+'\n'+url;const d=marketDialog('listing-share');d.innerHTML=`<div class="dialog-actions"><h2>E’lonni ulashish</h2><button type="button" class="dialog-close" aria-label="Ulashishni yopish" data-dialog-close>×</button></div><p>${esc(l.title)}</p><b class="market-price">${money(l.price)}</b><div class="field"><label for="share-url">E’lon havolasi</label><input id="share-url" readonly value="${esc(url)}"></div><div class="share-options"><button class="btn" type="button" id="share-native">↗ Rasm va havolani yuborish</button><button class="btn alt" type="button" id="share-copy">Havolani nusxalash</button><a class="btn alt" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(l.title+' · '+money(l.price))}">Telegram</a><a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text)}">WhatsApp</a><button class="btn alt" type="button" id="share-download">Rasmni yuklab olish</button></div><p class="muted" id="share-status">Rasm tayyorlanmoqda…</p>`;d.showModal();let file=null;const ready=sharedImageFile(l).then(f=>{file=f;if(document.getElementById('share-status'))document.getElementById('share-status').textContent='Rasm ichida ham sayt havolasi yoziladi. Ayrim ilovalar rasm yonidagi matnni tashlab yuborishi mumkin.'}).catch(()=>{if(document.getElementById('share-status'))document.getElementById('share-status').textContent='Havolani ulashish mumkin. Rasmni yuklab bo‘lmadi.'});const native=d.querySelector('#share-native');native.disabled=true;ready.finally(()=>native.disabled=false);
 native.onclick=async()=>{try{const data=file&&navigator.canShare?.({files:[file]})?{files:[file],title:l.title,text}:{title:l.title,text,url};if(navigator.share)await navigator.share(data);else{await copyText(text);toast('E’lon havolasi nusxalandi. Rasmni yuklab olib birga yuboring.')}}catch(e){if(e.name!=='AbortError')toast('Ulashish ochilmadi. Telegram, WhatsApp yoki havolani nusxalashdan foydalaning.')}};
 d.querySelector('#share-copy').onclick=async()=>{try{await copyText(url);toast('E’lon havolasi nusxalandi')}catch(e){toast(e.message)}};
 d.querySelector('#share-download').onclick=async()=>{await ready;if(!file)return toast('Rasmni yuklab bo‘lmadi');const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)};
}
function sellerSearch(){return lazy('#/sellers','Sotuvchilarni qidirish',async()=>{let profiles=[];if(S.sellerQuery?.length>=2)profiles=(await api('/api/sellers',{query:S.sellerQuery})).profiles;return `<p class="muted">Sotuvchini @nik orqali toping, profilini va sotuvdagi hayvonlarini ko‘ring.</p><form id="seller-search" style="display:flex;gap:8px;margin:20px 0"><input id="seller-query" type="search" placeholder="@nikni yozing" value="${esc(S.sellerQuery||'')}" aria-label="Sotuvchi niki" minlength="2" maxlength="24" style="flex:1;min-width:0"><button class="btn">Qidirish</button></form>${profiles.length?profiles.map(p=>`<a class="card seller-row" data-seller="${esc(p.nickname)}" href="#/seller"><span class="seller-avatar">${esc((p.display_name||p.nickname).slice(0,1).toUpperCase())}</span><div><h3>@${esc(p.nickname)}</h3><p>${esc(p.display_name)}</p><p class="muted">${esc(p.bio)}</p></div><span style="margin-left:auto">→</span></a>`).join(''):`<div class="card"><p>${S.sellerQuery?'Sotuvchi topilmadi. Nikni tekshiring.':'Kamida 2 belgi yozib qidiring. Nikingizni Profil bo‘limida o‘zgartirishingiz mumkin.'}</p></div>`}`})}
function sellerView(){return lazy('#/sellers','Sotuvchi profili',async()=>{const nick=S.sellerNick||new URLSearchParams(location.search).get('seller');if(!nick)return '<p>Sotuvchini qidiruvdan tanlang.</p>';const {profile:p,listings}=await api('/api/sellers',{nickname:nick}),f=await favSet();return `<div class="card"><div class="seller-head"><span class="seller-avatar">${esc((p.display_name||p.nickname).slice(0,1).toUpperCase())}</span><div><h2>@${esc(p.nickname)}</h2><p>${esc(p.display_name)}</p><b>${listings.filter(l=>l.status==='active').length} ta faol e’lon</b></div></div><p style="white-space:pre-wrap;margin:20px 0">${esc(p.bio)}</p><button class="btn alt" type="button" data-share-seller="${esc(p.nickname)}">Profil havolasini nusxalash</button>${p.user_id===S.uid?' <a class="btn" href="#/profile">Profilni tahrirlash</a>':''}<p class="muted">Sotuvchi bilan bog‘lanish uchun e’lonini ochib telefon yoki chatni tanlang.</p></div><h2 style="margin:28px 0 16px">E’lonlar</h2><div class="grid g2">${listings.length?listings.map(l=>lcard(l,f)).join(''):'<div class="card">Hozircha e’lon yo‘q.</div>'}</div>`})}
let sellerLoadedForm=null;
new MutationObserver(()=>{const form=document.getElementById('seller-edit');if(!form||form===sellerLoadedForm||!SB)return;sellerLoadedForm=form;api('/api/sellers',{action:'mine'}).then(({profile:p})=>{if(!p||!form.isConnected)return;form.querySelector('#seller-handle').value=p.nickname;form.querySelector('#seller-display').value=p.display_name||'';form.querySelector('#seller-bio').value=p.bio||'';const link=form.querySelector('#my-seller-link');link.href='#/seller';link.dataset.seller=p.nickname}).catch(e=>toast(e.message))}).observe(document.getElementById('root'),{childList:true,subtree:true});
document.addEventListener('submit',async e=>{const form=e.target;if(form.id==='seller-search'){e.preventDefault();S.sellerQuery=form.querySelector('#seller-query').value.trim().replace(/^@/,'');render()}if(form.id==='seller-edit'){e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{await api('/api/sellers',{action:'update',nickname:form.querySelector('#seller-handle').value,display_name:form.querySelector('#seller-display').value,bio:form.querySelector('#seller-bio').value});toast('Sotuvchi profili saqlandi');sellerLoadedForm=null;render()}catch(x){toast(x.message)}finally{b.disabled=false}}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-zoom],.listing-photo img,[data-share-listing],[data-seller],[data-gallery-step],[data-dialog-close],[data-share-seller]');if(!b)return;const d=b.dataset;if(d.zoom||b.matches('.listing-photo img')){e.preventDefault();e.stopPropagation();const zoom=d.zoom?b:b.closest('.listing-photo').querySelector('[data-zoom]');if(zoom)openPhoto(zoom.dataset.zoom,Number(zoom.dataset.photoIndex)||0)}else if(d.shareListing){e.preventDefault();await shareListing(d.shareListing)}else if(d.seller){S.sellerNick=d.seller;const u=new URL(location.href);u.searchParams.delete('listing');u.searchParams.delete('seller');history.replaceState(null,'',u.pathname+u.search+u.hash);if(location.hash==='#/seller')render()}else if(d.galleryStep)stepPhoto(Number(d.galleryStep));else if(d.dialogClose)b.closest('dialog').close();else if(d.shareSeller){try{await copyText(sellerUrl(d.shareSeller));toast('Profil havolasi nusxalandi')}catch(x){toast(x.message)}}});


function consentView(){return pubTop()+`<main class="wrap" style="max-width:850px;padding:28px 16px"><h1>Shartlar bilan tanishing</h1><p>Hisobingizdan foydalanishdan oldin quyidagi hujjatlarni o‘qing. Rozilik bir marta hisobingizga saqlanadi.</p><details open class="card"><summary><b>Foydalanish shartlari · ${LEGAL_VERSION}</b></summary><div style="max-height:32vh;overflow:auto;padding:16px 0">${termsBody()}</div></details><br><details class="card"><summary><b>Maxfiylik siyosati · ${LEGAL_VERSION}</b></summary><div style="max-height:32vh;overflow:auto;padding:16px 0">${privacyBody()}</div></details><form id="consent-form" class="card" style="margin-top:20px"><label style="display:flex;gap:12px;align-items:flex-start;margin:16px 0"><input type="checkbox" id="accept-terms" required style="width:22px;height:22px;flex:none">Foydalanish shartlarini o‘qidim va roziman.</label><label style="display:flex;gap:12px;align-items:flex-start;margin:16px 0"><input type="checkbox" id="accept-privacy" required style="width:22px;height:22px;flex:none">Maxfiylik siyosati bilan tanishdim va unda ko‘rsatilgan xizmat maqsadlari uchun ma’lumotlarimga ishlov berilishiga roziman.</label><button class="btn">Roziman — profilga o‘tish</button><a id="lo" class="btn alt" href="#/">Hisobdan chiqish</a><p id="consent-error" role="alert"></p></form></main>`}
document.addEventListener('submit',async e=>{if(e.target.id!=='consent-form')return;e.preventDefault();const terms=$('#accept-terms').checked,privacy=$('#accept-privacy').checked;if(!terms||!privacy)return;const b=e.target.querySelector('button');b.disabled=true;try{const r=await api('/api/consent',{action:'accept',terms,privacy,version:LEGAL_VERSION});if(!r.accepted)throw Error('Rozilik saqlanmadi');S.consentRequired=false;location.hash='#/profile';render()}catch(x){$('#consent-error').textContent=x.message}finally{b.disabled=false}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-revoke-plan]');if(!b)return;if(!confirm('Bu hisobning pullik tarifini bekor qilib Bepulga o‘tkazasizmi?'))return;b.disabled=true;try{await api('/api/admin-action',{action:'revoke_plan',user_id:b.dataset.revokePlan});toast('Tarif bekor qilindi');render()}catch(x){toast(x.message);b.disabled=false}});

window.addEventListener('error',e=>{if(!/ResizeObserver/.test(e.message||''))toast('Xato: '+(e.message||'noma’lum'))});window.addEventListener('unhandledrejection',e=>toast('Xato: '+((e.reason&&e.reason.message)||e.reason)));
const sharedAtLoad=new URLSearchParams(location.search);if(sharedAtLoad.has('listing'))S.mcur=sharedAtLoad.get('listing');if(sharedAtLoad.has('seller'))S.sellerNick=sharedAtLoad.get('seller');render();initApp();
</script>
