*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--tx);font:16px/1.55 "Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;border:1.5px solid var(--g);background:var(--g);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.alt{background:transparent;color:var(--g)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:18px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.muted{color:var(--mut)}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--gl);color:var(--g)}
.pill.w{background:#fdf0d5;color:#8a5a00}.pill.b{background:#dfeaff;color:#1b4fb0}
.disc{border-left:4px solid var(--warn);background:#fdf6e3;color:#5c4200;padding:10px 14px;border-radius:10px;font-size:.92rem}

.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none}

.scan .line{position:absolute;left:14%;right:14%;height:3px;background:#fff;box-shadow:0 0 14px 4px rgba(255,255,255,.7);border-radius:3px;animation:sc 3s ease-in-out infinite alternate}

section.s{padding:44px 0}
.steps{counter-reset:s}.steps .card::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;font-weight:800;margin-bottom:10px}
details{border-bottom:1px solid var(--bd);padding:14px 0}summary{cursor:pointer;font-weight:700}
footer{padding:30px 0 90px;color:var(--mut);font-size:.9rem}

.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--gd);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side a,.bn a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:600}
.side a:hover,.side a.on{background:rgba(255,255,255,.14)}
.main{flex:1;min-width:0;padding:24px 20px 100px;max-width:1000px}
.bn{display:none}

.bn a{flex:1;flex-direction:column;gap:2px;font-size:.72rem;padding:8px 2px;min-height:56px;justify-content:center;color:var(--mut)}.bn a.on{color:var(--g)}}
.stat b{display:block;font-size:1.7rem;letter-spacing:-.02em}
.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:700;font-size:.92rem}
.field input,.field select,.field textarea{min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card)}
.an{display:flex;gap:14px}.ph{width:84px;height:84px;border-radius:14px;background:var(--gl);display:grid;place-items:center;font-size:2.2rem;flex:none}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars i{flex:1;background:linear-gradient(var(--g),#5fbf88);border-radius:8px 8px 0 0;transform-origin:bottom;animation:gr .8s ease both}
@keyframes gr{from{transform:scaleY(0)}}
.chat{display:grid;gap:10px;margin-bottom:14px}.msg{padding:12px 14px;border-radius:16px;max-width:85%}.msg.u{background:var(--g);color:#fff;justify-self:end}.msg.a{background:var(--gl);border:1px solid var(--bd)}
.meter{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.meter i{display:block;height:100%;background:var(--g)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--cream);padding:12px 18px;border-radius:12px;z-index:9;box-shadow:var(--sh)}
.hero{position:relative;overflow:hidden}.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}.rv.in{opacity:1;transform:none}
.blob{position:absolute;border-radius:50%;filter:blur(44px);opacity:.3;animation:fl 9s ease-in-out infinite alternate;pointer-events:none}@keyframes fl{to{transform:translate(30px,-24px) scale(1.15)}}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px)}
body{overflow-x:hidden}img{max-width:100%}input[type=file]{max-width:100%;min-height:auto;padding:10px}

@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}*{animation:none!important;transition:none!important}}

  if(b.id=='gg')googleLogin();
  else if(b.id=='rs'){const em=($('#e')||{}).value||'';if(!/^\S+@\S+\.\S+$/.test(em)){toast('Avval email kiriting');return}const r=await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin});toast(r.error?'Xatolik yuz berdi':'Parolni tiklash havolasi emailga yuborildi')}
  else{e.preventDefault();await SB.auth.signOut();location.href='/'}});
async function initApp(){
  DL={save:({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;a.click();return Promise.resolve()}};
  fetch('/i18n.json').then(r=>r.ok?r.json():{}).then(j=>{Object.entries(j).forEach(([k,v])=>TR[k]=[v.ru,v.en,v.kk,v.ky]);if(S.lang&&S.lang!='uz')render()}).catch(()=>{});try{const c=await(await fetch('/api/config')).json();if(!c.url||!c.key)throw new Error('Serverda SUPABASE_URL yoki SUPABASE_ANON_KEY kiritilmagan');if(!window.supabase)throw new Error('Supabase skripti yuklanmadi (internet yoki reklama bloker)');window.CFG=c;SB=window.supabase.createClient(c.url,c.key);
    SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('Yangi parol (kamida 8 belgi)');if(p&&p.length>=8)SB.auth.updateUser({password:p}).then(()=>toast('Parol yangilandi'))}});
    const {data}=await SB.auth.getSession();if(data.session)await onSession(data.session)}catch(e){toast('Serverga ulanib bo‘lmadi: '+((e&&e.message)||e))}}
/* ---------- v1.1: admin, push, tx ---------- */
const tx=s=>{if(!S.lang||S.lang=='uz')return s;const t=TR[s];return t?(t[{ru:0,en:1,kk:2,ky:3}[S.lang]]||s):s};
const urlB64=s=>{const b=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function enablePush(){try{if(!SB||!S.user)return toast('Avval tizimga kiring');if(await Notification.requestPermission()!=='granted')return toast('Ruxsat berilmadi');
 const c=await(await fetch('/api/config')).json();if(!c.vapid)return toast('Push hali sozlanmagan');
 const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
 const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(c.vapid)});
 const {data}=await SB.auth.getSession();const r=await SB.from('push_subs').upsert({endpoint:sub.endpoint,user_id:data.session.user.id,sub:sub.toJSON()});
 toast(r.error?'Obunani saqlab bo‘lmadi':'Push bildirishnomalar yoqildi')}catch(_){toast('Bu qurilmada push ishlamadi')}}
function adminLive(){setTimeout(async()=>{const el=$('#adm');if(!el)return;try{const r=await fetch('/api/admin-stats',{headers:{Authorization:'Bearer '+await tok()}});if(!r.ok)throw 0;const d=await r.json();
 el.outerHTML=`<div class="grid g4"><div class="card stat"><b>${d.users}</b>Foydalanuvchilar</div><div class="card stat"><b>${d.animals}</b>Hayvonlar</div><div class="card stat"><b>${d.scans}</b>AI skan (30 kun)</div><div class="card stat"><b>${d.chats}</b>AI savol (30 kun)</div></div><br><div class="card"><h3>AI provayderlar</h3>${(d.ai||[]).map(a=>`<p>${esc(a.name)}: <b>${a.enabled?(a.cooldown?'vaqtincha o‘chiq (zaxiraga o‘tilgan)':'faol'):'kalit yo‘q'}</b></p>`).join('')}</div><br><div class="card"><h3>Tariflar</h3>${Object.entries(d.plans).map(([k,v])=>`<p>${esc(k)}: <b>${v}</b></p>`).join('')||'—'}</div><br><div class="card"><h3>Oxirgi foydalanuvchilar</h3>${tbl(['Ism','Viloyat','Sana'],d.recent.map(x=>[esc(x.full_name||'—'),esc(x.region||'—'),(x.created_at||'').slice(0,10)]))}</div><br><div class="card"><h3>To‘lov kutilayotgan e’lonlar</h3>${d.pending.length?d.pending.map(x=>`<p>${esc(x.title)} · ${money(x.price)} · ${esc(x.phone)} <button class="btn alt" style="min-height:36px" data-appr="${x.id}">Tasdiqlash</button></p>`).join(''):'<p class="muted">Yo‘q</p>'}</div><br><div class="card"><h3>Tarif berish</h3><div class="field"><label for="gu">Foydalanuvchi ID</label><input id="gu"></div><div class="field"><label for="gp">Tarif</label><select id="gp"><option>Pro</option><option>Ferma</option><option>Bepul</option></select></div><div class="field"><label for="gm">Oy</label><input id="gm" type="number" value="1" min="1" max="24"></div><button class="btn" id="gpl">Berish</button></div><br><div class="card"><h3>Audit log</h3>${tbl(['Vaqt','Harakat'],d.audit.map(x=>[(x.at||'').slice(0,16).replace('T',' '),esc(x.action)]))}</div>`}catch(_){el.textContent='Sizda bu ma’lumotni ko‘rish huquqi yo‘q.'}},0);
 return shell('#/admin',H('Admin panel')+'<div id="adm" class="card">Yuklanmoqda…</div>')}
/* ---------- v1.3: Chorva bozori ---------- */
const MSP=["Sigir","Buqa","Buzoq","Qo‘y","Echki","Ot","Tovuq","G‘oz / o‘rdak","Boshqa parranda","Boshqa"];
const RG=["Toshkent","Samarqand","Farg‘ona","Andijon","Namangan","Buxoro","Xorazm","Qashqadaryo","Surxondaryo","Jizzax","Sirdaryo","Navoiy","Qoraqalpog‘iston"];
const money=n=>Number(n).toLocaleString('ru')+" so‘m";
const pubUrl=p=>p?SB.storage.from('listing-photos').getPublicUrl(p).data.publicUrl:'';
const first=l=>pubUrl((l.photos&&l.photos[0])||l.photo_path);
const pic=(u,x='')=>u?`<img src="${esc(u)}" alt="E’lon rasmi" loading="lazy" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;${x}">`:`<div class="ph" style="width:100%;height:auto;aspect-ratio:4/3">🐾</div>`;
const meId=async()=>(await SB.auth.getSession()).data.session.user.id;
const lazy=(route,title,fn)=>{setTimeout(async()=>{const el=$('#mk');if(!el)return;try{el.innerHTML=await fn()}catch(e){console.error(e);el.innerHTML='<p class="disc">Ma’lumotni yuklab bo‘lmadi. Internetni tekshirib, qayta urinib ko‘ring.</p>'}},0);return shell(route,H(title)+'<div id="mk">Yuklanmoqda…</div>')};
const favSet=async()=>{const {data}=await SB.from('listing_favorites').select('listing_id');return new Set((data||[]).map(x=>x.listing_id))};
const FB='position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:1.4rem;cursor:pointer;z-index:2;box-shadow:var(--sh)';
const lcard=(l,f)=>`<article class="card" style="position:relative"><button type="button" data-fav="${l.id}" aria-label="Saqlash" style="${FB}">${f.has(l.id)?'❤️':'🤍'}</button><a href="#/market-view" data-lv="${l.id}" style="text-decoration:none">${pic(first(l))}<h3 style="margin-top:10px">${esc(l.title)}</h3></a><p><b>${money(l.price)}</b> <span class="pill">${esc(l.species||'')}</span>${l.status=='sold'?' <span class="pill w">Sotilgan</span>':''}</p><p class="muted">${esc(l.region||'')} · ${esc(l.age||'')} · ${esc(l.weight||'')}</p></article>`;
const mnav='<p style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn alt" href="#/market-saved">❤️ Saqlanganlar</a><a class="btn alt" href="#/market-chats">💬 Xabarlar</a><a class="btn alt" href="#/market-my">📦 E’lonlarim</a></p>';
function market(){return shell("#/market",H("Chorva bozori")+`<p class="muted">Nima qilmoqchisiz?</p><div class="grid g2"><a class="card" href="#/market-buy" style="text-decoration:none"><div style="font-size:3rem" aria-hidden="true">🛒</div><h2>Sotib olish</h2><p class="muted">E’lonlar katalogi, tur bo‘yicha qidiruv, sotuvchi bilan chat.</p></a><a class="card" href="#/market-add" style="text-decoration:none"><div style="font-size:3rem" aria-hidden="true">💰</div><h2>Sotish</h2><p class="muted">Rasm, narx, izoh va telefon raqam bilan e’lon bering.</p></a></div><br>${mnav}`)}
function mbuy(){return lazy("#/market","Sotib olish",async()=>{const sp=S.mf||'',q=(S.mq||'').trim(),rg=S.mr||'',so=S.ms||'new',lim=S.mlim||20;
 let Q=SB.from('listings').select('*').eq('status','active');if(sp)Q=Q.eq('species',sp);if(rg)Q=Q.eq('region',rg);if(q)Q=Q.ilike('title','%'+q.replace(/[%_,()]/g,' ')+'%');
 Q=so=='asc'?Q.order('price',{ascending:true}):so=='desc'?Q.order('price',{ascending:false}):Q.order('created_at',{ascending:false});
 const [{data,error},f]=await Promise.all([Q.limit(lim),favSet()]);if(error)throw error;
 const chips=['',...MSP].map(x=>`<button type="button" class="pill" data-sp="${x}" style="border:0;cursor:pointer;min-height:40px;padding:0 14px;${x==sp?'background:var(--g);color:#fff':''}">${x||'Hammasi'}</button>`).join('');
 return `${mnav}<form id="mqf" style="display:flex;gap:8px;margin:12px 0"><input id="mq" type="search" aria-label="Qidirish" placeholder="Qidirish: nom yoki zot" value="${esc(S.mq||'')}" style="flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card)"><button class="btn">Qidirish</button></form><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${chips}</div><div class="grid g2"><div class="field"><label for="mr">Viloyat</label><select id="mr"><option value="">Hammasi</option>${RG.map(x=>`<option ${x==rg?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="ms">Saralash</label><select id="ms"><option value="new" ${so=='new'?'selected':''}>Yangilari</option><option value="asc" ${so=='asc'?'selected':''}>Arzonlari</option><option value="desc" ${so=='desc'?'selected':''}>Qimmatlari</option></select></div></div><div class="grid g2">${data.length?data.map(l=>lcard(l,f)).join(''):'<div class="card"><h3>E’lon topilmadi</h3><p class="muted">Boshqa tur yoki so‘z bilan qidirib ko‘ring.</p></div>'}</div>${data.length>=lim?'<p><button class="btn alt" id="mmore">Yana ko‘rsatish</button></p>':''}`})}
function msaved(){return lazy("#/market","Saqlanganlar",async()=>{const {data}=await SB.from('listing_favorites').select('listing_id, listings(*)').order('created_at',{ascending:false});const L=(data||[]).map(x=>x.listings).filter(Boolean),f=new Set(L.map(l=>l.id));
 return mnav+(L.length?`<div class="grid g2">${L.map(l=>lcard(l,f)).join('')}</div>`:'<div class="card"><p>Saqlangan e’lon yo‘q. Katalogda 🤍 belgisini bosing.</p></div>')})}
function mview(){return lazy("#/market","E’lon",async()=>{const {data:l}=await SB.from('listings').select('*').eq('id',S.mcur).maybeSingle();if(!l)return '<div class="card">E’lon topilmadi.</div>';const me=await meId(),f=await favSet(),ph=(l.photos&&l.photos.length?l.photos:[l.photo_path]).map(pubUrl).filter(Boolean);
 return `<div class="card" style="position:relative"><button type="button" data-fav="${l.id}" aria-label="Saqlash" style="${FB}">${f.has(l.id)?'❤️':'🤍'}</button>${pic(ph[0],'')}${ph.length>1?`<div style="display:flex;gap:8px;margin-top:8px">${ph.map(u=>`<img src="${esc(u)}" alt="Qo‘shimcha rasm" style="width:72px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="this.closest('.card').querySelector('img').src=this.src">`).join('')}</div>`:''}<h2 style="margin-top:12px">${esc(l.title)}</h2><p><b style="font-size:1.4rem">${money(l.price)}</b> ${l.status=='sold'?'<span class="pill w">Sotilgan</span>':''}</p><p class="muted">${esc(l.species||'')} · ${esc(l.breed||'')} · ${esc(l.age||'')} · ${esc(l.weight||'')} · ${esc(l.region||'')}</p><p>${esc(l.description||'')}</p>${l.seller_id==me?'<p class="pill">Bu sizning e’loningiz</p>':`<p style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="tel:${esc(l.phone)}">📞 ${esc(l.phone)}</a><a class="btn alt" href="#/market-thread" data-tt="${l.id}|${l.seller_id}">💬 Chat</a></p>`}<p class="disc">Sotib olishdan oldin hayvonni o‘zingiz ko‘rib, veterinariya hujjatlarini tekshiring. Platforma bitimda ishtirok etmaydi.</p></div>`})}
function madd(){const m=window.CFG&&CFG.fee==='manual';return shell("#/market",H("Sotish: e’lon berish")+`<p class="disc">${m?'E’lon narxi: <b>10 000 so‘m</b> / 1 ta hayvon. <b>Pro</b> tarif egalari uchun bepul.':'Hozircha e’lon berish <b>bepul</b>.'} Rasm AI orqali tekshiriladi: faqat sotiladigan jonli hayvonning haqiqiy rasmi qabul qilinadi.</p><br><form class="card" id="mf2" novalidate><div class="field"><label for="ml_f">Rasm (1–3 ta, JPG yoki PNG) *</label><input id="ml_f" type="file" accept="image/jpeg,image/png" multiple></div><div id="prev" style="display:flex;gap:8px;margin-bottom:14px"></div><div class="field"><label for="ml_s">Hayvon turi *</label><select id="ml_s">${MSP.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="ml_t">Sarlavha *</label><input id="ml_t" maxlength="80" placeholder="masalan, Simmental buzoq, 6 oylik"></div><div class="field"><label for="ml_b">Zot</label><input id="ml_b"></div><div class="field"><label for="ml_a">Yoshi</label><input id="ml_a"></div><div class="field"><label for="ml_w">Vazni (taxminan)</label><input id="ml_w"></div><div class="field"><label for="ml_p">Narxi (so‘m) *</label><input id="ml_p" type="number" min="1" inputmode="numeric"></div><div class="field"><label for="ml_r">Viloyat</label><select id="ml_r">${RG.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="ml_ph">Telefon raqam *</label><input id="ml_ph" type="tel" placeholder="+998 90 123 45 67"></div><div class="field"><label for="ml_d">Izoh (tavsif)</label><textarea id="ml_d" rows="4" maxlength="1000" placeholder="Hayvonning holati, ozuqasi, emlanganmi va hokazo"></textarea></div><div id="er2" role="alert" style="color:var(--bad);margin-bottom:10px"></div><button class="btn">E’lonni joylash</button></form>`)}
function mmy(){return lazy("#/market","E’lonlarim",async()=>{const me=await meId();const {data}=await SB.from('listings').select('*').eq('seller_id',me).neq('status','removed').order('created_at',{ascending:false});const ST={pending_payment:'To‘lov kutilmoqda',active:'Faol',sold:'Sotilgan'};
 return `<p><a class="btn" href="#/market-add">➕ Yangi e’lon</a></p>`+(data.length?data.map(l=>`<div class="card" style="margin-bottom:12px;display:flex;gap:14px"><div style="width:96px;flex:none">${pic(first(l))}</div><div><h3>${esc(l.title)}</h3><p>${money(l.price)} <span class="pill ${l.status=='active'?'':'w'}">${ST[l.status]||l.status}</span></p>${l.status=='pending_payment'?'<p class="muted">To‘lov tasdiqlangach e’lon chiqadi. Raqam: '+l.id.slice(0,8)+'</p>':''}<p style="display:flex;gap:8px;flex-wrap:wrap">${l.status=='active'?`<button class="btn alt" data-ms="${l.id}|sold">Sotildi</button>`:''}<button class="btn alt" data-ms="${l.id}|removed">O‘chirish</button></p></div></div>`).join(''):'<div class="card"><p>Sizda hali e’lon yo‘q.</p></div>')})}
function mchats(){return lazy("#/market","Xabarlar",async()=>{const me=await meId();const {data}=await SB.from('listing_messages').select('*, listings(title)').order('at',{ascending:false}).limit(200);const seen={},rows=[];(data||[]).forEach(m=>{const peer=m.from_id==me?m.to_id:m.from_id,k=m.listing_id+'|'+peer;if(!seen[k]){seen[k]=1;rows.push([m,peer])}});
 return rows.length?rows.map(([m,peer])=>`<a class="card" style="display:block;margin-bottom:10px;text-decoration:none" href="#/market-thread" data-tt="${m.listing_id}|${peer}"><b>${esc(m.listings?m.listings.title:'E’lon')}</b><p class="muted">${esc(m.body.slice(0,80))}</p></a>`).join(''):'<div class="card"><p>Hali xabar yo‘q.</p></div>'})}
const loadMsgs=async(lid,peer,me)=>{const {data}=await SB.from('listing_messages').select('*').eq('listing_id',lid).or(`and(from_id.eq.${me},to_id.eq.${peer}),and(from_id.eq.${peer},to_id.eq.${me})`).order('at');return (data||[]).map(m=>`<div class="msg ${m.from_id==me?'u':'a'}">${esc(m.body)}</div>`).join('')||'<p class="muted">Birinchi xabarni yozing.</p>'};
function mthread(){return lazy("#/market","Chat",async()=>{const [lid,peer]=(S.th||'|').split('|'),me=await meId();clearInterval(S.poll);
 S.poll=setInterval(async()=>{const b=$('#cb');if(!b){clearInterval(S.poll);return}try{const h=await loadMsgs(lid,peer,me);if(b.dataset.h!==h){b.dataset.h=h;b.innerHTML=h;b.scrollTop=b.scrollHeight}}catch(_){}},4000);
 return `<div class="chat" id="cb" style="max-height:55vh;overflow:auto">${await loadMsgs(lid,peer,me)}</div><form id="tf" style="display:flex;gap:8px"><input id="tq" aria-label="Xabar" maxlength="1000" style="flex:1;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card)"><button class="btn">Yuborish</button></form><p class="muted">Yangi xabarlar o‘zi chiqadi.</p>`})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-lv],[data-tt],[data-ms],[data-appr],[data-sp],[data-fav],#mmore,#gpl');if(!b)return;const d=b.dataset;
 if(d.lv)S.mcur=d.lv;else if(d.tt)S.th=d.tt;
 else if(d.sp!==undefined){S.mf=d.sp;S.mlim=20;render()}
 else if(b.id=='mmore'){S.mlim=(S.mlim||20)+20;render()}
 else if(d.fav){e.preventDefault();const on=b.textContent.trim()=='❤️';const r=on?await SB.from('listing_favorites').delete().eq('listing_id',d.fav):await SB.from('listing_favorites').upsert({user_id:await meId(),listing_id:d.fav});if(r.error)toast('Saqlab bo‘lmadi');else b.textContent=on?'🤍':'❤️'}
 else if(d.ms){const [id,st]=d.ms.split('|');if(!confirm(st=='sold'?'E’lonni “sotildi” deb belgilaysizmi?':'E’lonni o‘chirasizmi?'))return;const r=await SB.from('listings').update({status:st}).eq('id',id);toast(r.error?'Xatolik yuz berdi':'Saqlandi');render()}
 else{const body=d.appr?{action:'approve',id:d.appr}:{action:'set_plan',user_id:$('#gu').value.trim(),plan:$('#gp').value,months:+$('#gm').value||1};try{await api('/api/admin-action',body);toast('Bajarildi');render()}catch(er){toast(er.message)}}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='mr'){S.mr=t.value;S.mlim=20;render()}else if(t.id=='ms'){S.ms=t.value;render()}
 else if(t.id=='ml_f'){const pv=$('#prev');pv.innerHTML='';[...t.files].slice(0,3).forEach(f=>{const i=document.createElement('img');i.alt='Tanlangan rasm';i.style.cssText='width:84px;height:64px;object-fit:cover;border-radius:8px';i.src=URL.createObjectURL(f);pv.appendChild(i)})}});
document.addEventListener('submit',async e=>{const f=e.target;
 if(f.id=='mqf'){e.preventDefault();S.mq=$('#mq').value;S.mlim=20;render()}
 else if(f.id=='tf'){e.preventDefault();const t=$('#tq').value.trim();if(!t)return;const [lid,peer]=S.th.split('|'),me=await meId();const r=await SB.from('listing_messages').insert({listing_id:lid,from_id:me,to_id:peer,body:t});if(r.error){toast('Xabar yuborilmadi');return}$('#tq').value='';const b=$('#cb');b.innerHTML=await loadMsgs(lid,peer,me);b.scrollTop=b.scrollHeight}
 else if(f.id=='mf2'){e.preventDefault();const v=id=>$('#'+id).value.trim(),er=$('#er2');er.style.color='var(--bad)';er.textContent='';const price=+v('ml_p'),tel=v('ml_ph').replace(/[\s()-]/g,''),files=[...$('#ml_f').files].slice(0,3);
  if(!v('ml_t')||!(price>0)||!/^\+?\d{9,13}$/.test(tel)){er.textContent='Sarlavha, narx va to‘g‘ri telefon raqamini kiriting.';return}
  if(!files.length||files.some(x=>!/^image\/(jpeg|png)$/.test(x.type))){er.textContent='Rasm yuklanmadi. JPG yoki PNG formatidan foydalaning.';return}
  const btn=f.querySelector('button');btn.disabled=true;er.style.color='var(--ok)';er.textContent='Rasm tekshirilmoqda, bir oz kuting…';
  try{const images=await Promise.all(files.map(async x=>b64(await comp(x))));
   const r=await api('/api/listings',{title:v('ml_t'),species:v('ml_s'),breed:v('ml_b'),age:v('ml_a'),weight:v('ml_w'),price,region:v('ml_r'),phone:tel,description:v('ml_d'),images});
   if(r.status=='active'){toast('E’lon joylandi');location.hash='#/market-my'}
   else f.outerHTML=`<div class="card"><h3>E’lon qabul qilindi: to‘lov kutilmoqda</h3><p>E’lon narxi 10 000 so‘m. To‘lovdan keyin e’lon bozorda ko‘rinadi.</p><p><b>${esc(r.pay||'')}</b></p><p class="muted">E’lon raqami: ${r.id.slice(0,8)}</p><a class="btn" href="#/market-my">E’lonlarim</a></div>`}
  catch(x){er.style.color='var(--bad)';er.textContent=x.message||'Xatolik yuz berdi. Qayta urinib ko‘ring.';btn.disabled=false}}});
window.addEventListener('error',e=>{if(!/ResizeObserver/.test(e.message||''))toast('Xato: '+(e.message||'noma’lum'))});window.addEventListener('unhandledrejection',e=>toast('Xato: '+((e.reason&&e.reason.message)||e.reason)));
render();initApp();
</script>
